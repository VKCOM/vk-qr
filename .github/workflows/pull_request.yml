name: 'Pull Request'

on: [ 'pull_request' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node setup
        uses: ./.github/actions/node-setup

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test

  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.DEVTOOLS_GITHUB_TOKEN }}
